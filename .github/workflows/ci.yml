name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run check:licenses
      - run: npm audit --omit=dev --audit-level=high
      - name: Captions-only timing is reproducible
        run: |
          npm run narrate -- explainer --captions-only
          npm run narrate -- template --captions-only
          git diff --exit-code public/narration
      - name: Quick start, exactly as in the README
        run: npm run make -- explainer
      - run: npm run srt -- explainer out/captions/explainer.srt
      # The example has no narration, so finish must leave its sound effects as rendered.
      - name: Short render, then finish
        run: |
          npm run render -- explainer out/short.mp4 --frames=700-800
          npm run finish -- out/short.mp4 out/short-finished.mp4 --video explainer
      - run: npm run smoke
      - name: The ElevenLabs key never reaches the Studio page
        run: sh scripts/studio-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 22
        with:
          name: example-output
          path: |
            out/explainer.mp4
            out/explainer.srt
            out/smoke/

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .
